<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC832"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Amber rounded square background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Crown icon — faithful to the logo: two peaks + base bar -->
  <!-- stroke width scaled generously so it's visible as favicon -->
  <g transform="translate(96, 120)">
    <!-- Crown outline with 2-peak shape -->
    <path
      d="M20 230
         L20 185
         L0 60
         L80 130
         L160 10
         L240 130
         L320 60
         L300 185
         L300 230
         Z"
      fill="none"
      stroke="#1a1008"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Base line 1 -->
    <line x1="10" y1="255" x2="310" y2="255" stroke="#1a1008" stroke-width="28" stroke-linecap="round"/>
    <!-- Base line 2 -->
    <line x1="10" y1="290" x2="310" y2="290" stroke="#1a1008" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
