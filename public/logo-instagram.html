<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo Real - Logo Instagram</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fundo preto puro para destacar ou transparente/escuro do instagram */
            background-color: #09090b;
            /* zinc-950 */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Container que simula exatamente o corte redondo do Instagram (1080x1080) */
        .ig-profile-container {
            width: 1080px;
            height: 1080px;
            background-color: #09090b;
            /* Fundo do logo */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: relative;
            /* Guia visual redonda opcional para ver como o IG vai cortar */
            /* border-radius: 50%; */
            /* border: 2px dashed #333; */
        }

        .logo-box {
            width: 320px;
            height: 320px;
            border-radius: 64px;
            /* bg-gradient-to-br from-amber-300 to-amber-500 */
            background: linear-gradient(to bottom right, #fcd34d, #f59e0b);
            /* shadow-[0_0_15px_rgba(251,191,36,0.3)] mas aumentada para o tamanho */
            box-shadow: 0 0 100px rgba(251, 191, 36, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG da Coroa exato do lucide-react */
        .crown-icon {
            width: 180px;
            height: 180px;
            color: #09090b;
            /* text-zinc-950 */
            stroke-width: 2.5;
        }

        .logo-text {
            color: white;
            font-size: 110px;
            font-weight: bold;
            letter-spacing: -0.025em;
            /* tracking-tight */
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="ig-profile-container">
        <!-- Ícone da Coroa Dourado -->
        <div class="logo-box" id="logo-icon">
            <svg class="crown-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.518l4.276 3.664a1 1 0 0 0 1.516-.294z" />
                <path d="M5 21h14" />
            </svg>
        </div>

        <!-- Texto (opcional, mas geralmente na foto de perfil do IG usamos só o símbolo) -->
        <!-- Deixei comentado, se quiser aparecer escrito embaixo é só descomentar -->
        <!-- <h1 class="logo-text">Estudo Real</h1> -->
    </div>

    <script>
        console.log("Abra esta janela no máximo, aperte Cmd+Shift+4 e tire print do quadrado perfeito ou use uma ferramenta de captura.");
    </script>
</body>

</html>
